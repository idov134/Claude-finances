[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksel"
version = "0.1.0"
description = "Skeptical, leakage-aware stock selection research system (walk-forward, purged CV, DSR, PBO)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5", "lightgbm>=4.3",
                "matplotlib>=3.8", "PyYAML>=6.0", "joblib>=1.3", "requests>=2.31"]

[project.optional-dependencies]
llm = ["anthropic"]
yahoo = ["yfinance"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["stocksel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
